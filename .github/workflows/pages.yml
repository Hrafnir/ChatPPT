name: Publiser ChatPPT på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CHATPPT_API_URL != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
      - name: Sett offentlig adresse til chattjenesten
        env:
          CHATPPT_API_URL: ${{ vars.CHATPPT_API_URL }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from "node:fs";
          const url = new URL(process.env.CHATPPT_API_URL);
          if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash || url.pathname !== "/api/chat") {
            throw new Error("CHATPPT_API_URL må være en HTTPS-adresse med stien /api/chat.");
          }
          writeFileSync("public/config.js", "globalThis.CHATPPT_API_URL = " + JSON.stringify(url.href) + ";\n");
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
