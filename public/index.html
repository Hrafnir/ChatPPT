<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <meta name="description" content="ChatPPT – en satirisk chatbot om skolehverdagen.">
  <title>ChatPPT</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./config.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main class="chat" aria-labelledby="chat-title">
    <header class="chat-header">
      <h1 id="chat-title">Chat<span>PPT</span></h1>
      <div class="ribbon"><span>Satire</span></div>
    </header>
    <section id="transcript" class="transcript" aria-label="Samtale med ChatPPT" tabindex="0" hidden></section>
    <div class="composer-area">
      <form id="composer">
        <label class="visually-hidden" for="message">Melding til ChatPPT</label>
        <textarea id="message" rows="1" maxlength="2000" placeholder="Skriv en melding …" aria-describedby="privacy"></textarea>
        <button id="send" type="submit" disabled>
          <span>Send</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 16-6-5.6 16-3.2-6.8L4 10Z"/><path d="M11.2 13.2 20 4"/></svg>
        </button>
      </form>
      <p id="privacy">Meldinger sendes til OpenAI. Unngå navn og elevopplysninger.</p>
    </div>
  </main>
  <div id="announcer" class="visually-hidden" role="status" aria-atomic="true"></div>
</body>
</html>
